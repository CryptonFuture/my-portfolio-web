<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
url("https://images.unsplash.com/photo-1521334884684-d80222895322?w=1600");
background-size:cover;
background-position:center;
color:white;
}

.container{
width:350px;
background:rgba(20,20,20,0.9);
padding:30px;
border-radius:15px;
backdrop-filter:blur(10px);
text-align:center;
}

h2{
margin-bottom:20px;
color:#D4AF37;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
outline:none;
}

button{
width:100%;
padding:12px;
border:none;
background:#D4AF37;
font-weight:600;
cursor:pointer;
border-radius:8px;
margin-top:10px;
}

p{
margin-top:15px;
font-size:14px;
}

a{
color:#D4AF37;
text-decoration:none;
}
</style>
</head>

<body>

<div class="container">
<h2>Create Account</h2>

<input type="text" placeholder="Full Name">
<input type="email" placeholder="Email">
<input type="password" placeholder="Password">
<input type="password" placeholder="Confirm Password">

<button onclick="location.href='dashboard2.html'">Sign Up</button>

<p>Already have an account? <a href="login1.html">Login</a></p>
</div>

</body>
</html>
