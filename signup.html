<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up | RimshaDesigns</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body{
  min-height:100vh;
  background:#0f0f0f;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial,sans-serif;
  color:white;
}
.card{
  background:#1a1a1a;
  padding:40px;
  width:380px;
  border-radius:18px;
  box-shadow:0 0 30px rgba(0,173,181,.3);
}
h2{color:#00adb5;text-align:center;margin-bottom:20px}
input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:8px;
  border:none;
}
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#00adb5;
  font-weight:bold;
  cursor:pointer;
}
p{text-align:center;margin-top:16px;font-size:14px}
a{color:#00adb5;text-decoration:none}
</style>
</head>

<body>

<div class="card">
  <h2>Create Account</h2>
  <input id="name" placeholder="Full Name">
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password (min 8 chars)">
  <button onclick="signup()">Sign Up</button>
  <p>Already have an account? <a href="login.html">Login</a></p>
</div>

<script>
function signup(){
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!name || !email || !password){
    alert("Fill all fields");
    return;
  }
  if(password.length < 8){
    alert("Password must be at least 8 characters");
    return;
  }

  localStorage.setItem("name", name);
  localStorage.setItem("email", email);
  localStorage.setItem("password", password);

  alert("Signup successful!");
  window.location.href = "dashboard.html";
}
</script>

</body>
</html>
