<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | RimshaDesigns</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
  min-height:100vh;
  background:url("https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=1950&q=80") center/cover fixed;
  display:flex;align-items:center;justify-content:center;color:white;
}
body::before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:-1}

.card{
  width:380px;
  background:rgba(0,0,0,.65);
  border:1px solid rgba(0,173,181,.4);
  border-radius:22px;
  padding:40px;
  backdrop-filter:blur(15px);
  position:relative;
}

.close{
  position:absolute;top:18px;right:18px;
  color:#00adb5;cursor:pointer;font-size:18px;
}

.logo{text-align:center;font-size:2rem;font-weight:bold;margin-bottom:30px}
.logo span{
  font-size:2.4rem;
  background:linear-gradient(45deg,#00adb5,#00ffcc);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

.field{position:relative;margin-bottom:22px}
.field label{
  position:absolute;top:-8px;left:14px;
  background:#000;padding:0 6px;
  font-size:12px;color:#00adb5;
}
.field input{
  width:100%;padding:14px 40px 14px 14px;
  border-radius:12px;border:1px solid rgba(0,173,181,.4);
  background:rgba(0,0,0,.6);color:white;
}
.field input::placeholder{color:#777}

.eye{
  position:absolute;right:14px;top:50%;
  transform:translateY(-50%);cursor:pointer;color:#00adb5;
}

.btn{
  width:100%;padding:14px;border:none;border-radius:14px;
  font-weight:bold;background:linear-gradient(45deg,#00adb5,#00ffcc);
  color:black;cursor:pointer;
}
.btn:hover{box-shadow:0 10px 25px rgba(0,173,181,.4)}

.switch{text-align:center;margin-top:18px;font-size:14px}
.switch a{color:#00adb5;text-decoration:none}
</style>
</head>

<body>
<div class="card">
  <i class="fa-solid fa-xmark close" onclick="location.href='index.html'"></i>

  <div class="logo"><span>R</span>imshaDesigns</div>

  <div class="field">
    <label>Email</label>
    <input type="email" placeholder="Required">
  </div>

  <div class="field">
    <label>Password</label>
    <input type="password" id="loginPass" placeholder="Required">
    <i class="fa-solid fa-eye eye" onclick="togglePass('loginPass',this)"></i>
  </div>

  <!-- <button class="btn" onclick="goDashboard()">Login</button> -->

  <div class="switch">
    Don’t have an account? <a href="signup.html">Sign up</a>
  </div>
</div>
<script>
function togglePass(id,icon){
  const input=document.getElementById(id);
  input.type=input.type==="password"?"text":"password";
  icon.classList.toggle("fa-eye-slash");
}
function goDashboard(){
  window.location.href="dashboard.html";
}
</script>
</body>
</html>
