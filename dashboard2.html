<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
display:flex;
background:#0b0b0b;
color:white;
}

/* SIDEBAR */
.sidebar{
width:260px;
height:100vh;
position:fixed;
left:0;
top:0;
background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
url("https://images.unsplash.com/photo-1523381210434-271e8be1f52b?w=800");
background-size:cover;
background-position:center;
padding:20px;
}

.logo{
font-size:22px;
font-weight:700;
color:#D4AF37;
text-align:center;
margin-bottom:30px;
background:rgba(0,0,0,0.6);
padding:10px;
border-radius:10px;
}

.sidebar a{
display:block;
color:white;
text-decoration:none;
padding:12px;
margin:10px 0;
background:rgba(0,0,0,0.4);
border-radius:8px;
transition:.3s;
}

.sidebar a:hover{
background:#D4AF37;
color:black;
}

/* MAIN */
.main{
margin-left:260px;
padding:30px;
width:100%;
}

h1{
color:#D4AF37;
margin-bottom:20px;
}

/* CARDS */
.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:#141414;
padding:20px;
border-radius:10px;
text-align:center;
}

/* FORM */
.form-box{
background:#141414;
padding:20px;
border-radius:10px;
max-width:500px;
}

.form-box input,
.form-box textarea{
width:100%;
padding:10px;
margin:10px 0;
border:none;
border-radius:6px;
outline:none;
}

.form-box button{
width:100%;
padding:12px;
background:#D4AF37;
border:none;
font-weight:600;
cursor:pointer;
border-radius:6px;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
<div class="logo">Misha Fabrics</div>

<a href="index.html">🏠 Home</a>
<a href="#">📦 Orders</a>
<a href="#">🛍 Products</a>
<a href="#">👤 Users</a>
<a href="login1.html">🚪 Logout</a>
</div>

<!-- MAIN -->
<div class="main">

<h1>Dashboard</h1>

<div class="cards">
<div class="card">Total Orders<br><b>120</b></div>
<div class="card">Revenue<br><b>Rs. 250,000</b></div>
<div class="card">Products<br><b>35</b></div>
</div>

<!-- FORM SECTION -->
<div class="form-box">
<h2>Add Product</h2>

<input type="text" placeholder="Product Name">
<input type="text" placeholder="Price">
<textarea rows="4" placeholder="Description"></textarea>

<button>Add Product</button>
</div>

</div>

</body>
</html>
