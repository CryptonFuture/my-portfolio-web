<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Misha Fabrics</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#0b0b0b;
}

.login-box{
width:420px;
background:#141414;
padding:40px;
border-radius:20px;
box-shadow:0 0 25px rgba(212,175,55,.2);
}

h2{
text-align:center;
color:#D4AF37;
margin-bottom:25px;
}

input{
width:100%;
padding:14px;
margin-bottom:15px;
background:#222;
border:none;
color:white;
border-radius:10px;
}

button{
width:100%;
padding:14px;
background:#D4AF37;
border:none;
font-weight:600;
cursor:pointer;
border-radius:10px;
}

p{
margin-top:15px;
text-align:center;
color:white;
}

a{
color:#D4AF37;
text-decoration:none;
}

</style>
</head>
<body>

<div class="login-box">

<h2>Login</h2>

<form id="loginForm">

<input type="email" placeholder="Email" required>

<input type="password" placeholder="Password" required>

<button type="submit">
Login
</button>

</form>

<p>
No account?
<a href="signup2.html">Create Account</a>
</p>

</div>

<script>

document.getElementById("loginForm")
.addEventListener("submit",function(e){

e.preventDefault();

window.location.href="dashboard2.html";

});

</script>

</body>
</html>
