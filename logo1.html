<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rimsha Designs Intro</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background: linear-gradient(135deg,#020617,#0f172a,#020617);
  font-family:'Poppins',sans-serif;
  color:white;
  text-align:center;
}

/* Welcome Text Above Logo */
.welcome {
  font-family:'Great Vibes',cursive;
  font-size:2.5rem;
  margin-bottom:25px;
  text-shadow:0 0 10px rgba(255,255,255,0.5);
}

/* Circle Logo */
.logo {
  width:70vw;
  max-width:400px;
  aspect-ratio:1/1;
  border-radius:50%;
  overflow:hidden;
  position:relative;
  box-shadow:
    0 0 30px rgba(255,255,255,0.3),
    0 0 60px rgba(255,255,255,0.15),
    0 20px 60px rgba(0,0,0,0.9);
  margin-bottom:25px;
}

.logo::before {
  content:'';
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  background-image:url("https://images.unsplash.com/photo-1501785888041-af3ef285b470");
  background-size:cover;
  background-position:center;
  z-index:1;
}

.overlay {
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.5);
  z-index:2;
}

/* Text inside Circle */
.text {
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:3;
}

.text h1 {
  font-family:'Great Vibes',cursive;
  font-weight: normal; /* normal weight */
  font-size:8vw;
  max-font-size:50px;
  margin:0;
  color:white;
  text-align:center;
  text-shadow:
    0 0 10px rgba(255,255,255,0.8),
    0 0 25px rgba(255,255,255,0.6),
    0 0 40px rgba(255,255,255,0.4);
}

.text p {
  margin-top:5px;
  font-weight: normal;
  font-size:3.5vw;
  max-font-size:18px;
  letter-spacing:2px;
  color:white;
  text-align:center;
}

/* Button */
.button-container a {
  display:inline-block;
  padding:15px 35px;
  background:#00adb5;
  color:#020617;
  font-weight:600;
  text-decoration:none;
  font-size:1rem;
  border-radius:8px;
  box-shadow:0 0 20px rgba(0,234,255,0.5);
  transition:all 0.3s ease;
}

.button-container a:hover {
  background:#00cfff;
  box-shadow:0 0 30px rgba(0,234,255,0.7);
  transform:translateY(-3px);
}

/* Top Loading Bar */
#top-loader {
  position:fixed;
  top:0; left:0;
  width:0%;
  height:5px;
  background:#00adb5;
  z-index:9999;
  transition:width 0.2s;
}

/* Responsive */
@media(max-width:768px){
  .welcome {font-size:1.8rem;}
  .text h1 {font-size:14vw;}
  .text p {font-size:5vw;}
  .button-container a {font-size:0.9rem;padding:12px 25px;}
}
</style>
</head>
<body>

<div class="welcome">Welcome to Rimsha Designs</div>

<div class="logo">
  <div class="overlay"></div>
  <div class="text">
    <h1>Rimsha</h1>
    <p>Designs</p>
  </div>
</div>

<div class="button-container">
  <a href="#" id="goWebsite">GO WITH ONE CLICK!</a>
</div>

<div id="top-loader"></div>

<script>
// Button click with loader and redirect
const goBtn = document.getElementById('goWebsite');
const loaderBar = document.getElementById('top-loader');

goBtn.addEventListener('click', function(e){
    e.preventDefault();
    loaderBar.style.width = '0%';
    loaderBar.style.display = 'block';
    let width = 0;
    
    function simulateLoad(){
        let speed = Math.random()*15 + 5; // simulate internet speed
        width += speed;
        if(width>=100){
            width = 100;
            loaderBar.style.width = width+'%';
            setTimeout(()=>{window.location.href='index.html';},300);
        } else {
            loaderBar.style.width = width+'%';
            setTimeout(simulateLoad,300);
        }
    }
    simulateLoad();
});
</script>

</body>
</html>
