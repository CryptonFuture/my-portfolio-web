<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | RimshaDesigns</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}

body{
  min-height:100vh;
  background:url("https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=1950&q=80") no-repeat center/cover fixed;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  z-index:-1;
}

/* CARD */
.signup-card{
  width:420px;
  background:rgba(0,0,0,0.65);
  border:1px solid rgba(0,173,181,0.4);
  border-radius:22px;
  padding:40px 35px;
  backdrop-filter:blur(15px);
  animation:fadeUp .8s ease;
}

/* LOGO */
.logo{
  text-align:center;
  font-size:1.9rem;
  font-weight:bold;
  margin-bottom:25px;
}
.logo span{
  font-size:2.3rem;
  background:linear-gradient(45deg,#00adb5,#00ffcc);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* INPUT GROUP */
.input-group{
  position:relative;
  margin-bottom:18px;
}
.input-group input{
  width:100%;
  padding:14px 45px 14px 14px;
  border-radius:12px;
  border:1px solid rgba(0,173,181,0.4);
  background:rgba(0,0,0,0.6);
  color:white;
  outline:none;
}
.input-group input::placeholder{color:#aaa;}

/* HOVER TEXT */
.input-group::after{
  position:absolute;
  right:12px;
  top:-22px;
  font-size:12px;
  color:#00adb5;
  opacity:0;
  transition:.3s;
}
.input-group.required:hover::after{
  content:"Required";
  opacity:1;
}
.input-group.username:hover::after{
  content:"Required";
  opacity:1;
}
.input-group.email:hover::after{
  content:"Enter a valid email";
  opacity:1;
}
.input-group.password:hover::after{
  content:"At least 8 characters";
  opacity:1;
}

/* EYE ICON */
.eye{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  color:#00adb5;
}

/* BUTTON */
.signup-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  font-weight:bold;
  background:linear-gradient(45deg,#00adb5,#00ffcc);
  color:black;
  cursor:pointer;
  transition:.3s;
}
.signup-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 25px rgba(0,173,181,.4);
}

/* FOOT */
.extra{
  margin-top:18px;
  text-align:center;
  font-size:14px;
}
.extra a{color:#00adb5;text-decoration:none;}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:none}
}
</style>
</head>
<body>

<div class="signup-card">

  <div class="logo">
    <span>R</span>imshaDesigns
  </div>

  <div class="input-group required">
    <input type="text" id="fullname" placeholder="Full Name">
  </div>

  <div class="input-group username">
    <input type="text" id="username" placeholder="Username">
  </div>

  <div class="input-group email">
    <input type="email" id="email" placeholder="Email Address">
  </div>

  <div class="input-group password">
    <input type="password" id="password" placeholder="Password">
    <i class="fa-solid fa-eye eye" onclick="togglePass('password',this)"></i>
  </div>

  <div class="input-group password">
    <input type="password" id="confirm" placeholder="Confirm Password">
    <i class="fa-solid fa-eye eye" onclick="togglePass('confirm',this)"></i>
  </div>

  <button class="signup-btn" onclick="signup()">Create Account</button>

  <div class="extra">
    Already have an account? <a href="login.html">Login</a>
  </div>

</div>

<script>
function togglePass(id,icon){
  const input=document.getElementById(id);
  if(input.type==="password"){
    input.type="text";
    icon.classList.replace("fa-eye","fa-eye-slash");
  }else{
    input.type="password";
    icon.classList.replace("fa-eye-slash","fa-eye");
  }
}

function signup(){
  const fullname=document.getElementById("fullname").value.trim();
  const username=document.getElementById("username").value.trim();
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const confirm=document.getElementById("confirm").value;

  const emailRegex=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  if(!fullname||!username||!email||!password||!confirm){
    alert("Please fill all fields.");
    return;
  }

  if(!emailRegex.test(email)){
    alert("The email is invalid.");
    return;
  }

  if(password.length<8||confirm.length<8){
    alert("Password must be at least 8 characters.");
    return;
  }

  if(password!==confirm){
    alert("Passwords do not match.");
    return;
  }

  localStorage.setItem("loggedIn","true");
  localStorage.setItem("fullname",fullname);
  localStorage.setItem("username",username);
  localStorage.setItem("email",email);

  window.location.href="dashboard.html";
}
</script>

</body>
</html>
